<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Autopoietic circuit — a self-weaving cybernetic mandala">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b1410"/>
      <stop offset="55%" stop-color="#060a08"/>
      <stop offset="100%" stop-color="#020403"/>
    </radialGradient>
    <linearGradient id="em" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#27e08a"/>
      <stop offset="100%" stop-color="#0fae62"/>
    </linearGradient>
    <linearGradient id="au" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8c45a"/>
      <stop offset="100%" stop-color="#b8902f"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <g transform="translate(600 337)" filter="url(#glow)" fill="none" stroke-linecap="round">
    <!-- octagonal frame -->
    <polygon points="0,-250 177,-177 250,0 177,177 0,250 -177,177 -250,0 -177,-177"
             stroke="url(#au)" stroke-width="1.2" opacity="0.35"/>
    <!-- rotating filament rings (autopoietic weave) -->
    <g stroke="url(#em)" stroke-width="1.6" opacity="0.85">
      <circle r="120" stroke-dasharray="14 9">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="34s" repeatCount="indefinite"/>
      </circle>
      <circle r="180" stroke-dasharray="6 14">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="46s" repeatCount="indefinite"/>
      </circle>
      <circle r="225" stroke-dasharray="22 12">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- radial spokes that regenerate (opacity pulses = self-repair) -->
    <g stroke="url(#au)" stroke-width="1">
      <line x1="0" y1="0" x2="0" y2="-250">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="0" x2="177" y2="-177">
        <animate attributeName="opacity" values="1;0.2;1" dur="6.4s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="0" x2="250" y2="0">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="4.2s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="0" x2="177" y2="177">
        <animate attributeName="opacity" values="1;0.2;1" dur="7.1s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="0" x2="0" y2="250">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="5.6s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="0" x2="-177" y2="177">
        <animate attributeName="opacity" values="1;0.2;1" dur="6.0s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="0" x2="-250" y2="0">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="4.8s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="0" x2="-177" y2="-177">
        <animate attributeName="opacity" values="1;0.2;1" dur="7.6s" repeatCount="indefinite"/>
      </line>
    </g>
    <!-- core node -->
    <circle r="9" fill="url(#em)">
      <animate attributeName="r" values="7;11;7" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- corner telemetry -->
  <g font-family="monospace" font-size="13" fill="#27e08a" opacity="0.5">
    <text x="24" y="30">SIGIL: OWL-6055</text>
    <text x="24" y="50">MODE: LOCAL-FIRST</text>
    <text x="24" y="70">EGRESS: NONE</text>
    <text x="978" y="650" text-anchor="end">SOLVE ET COAGULA</text>
  </g>
</svg>
